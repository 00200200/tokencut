name: 'tokencut Context Optimizer & Token Gate'
description: 'Token optimization engine and PR context impact gate for AI coding workflows.'
author: '00200200'

inputs:
  command:
    description: 'Command to run through tokencut'
    required: false
    default: ''
  pr-check:
    description: 'Analyze PR token delta and post summary'
    required: false
    default: 'false'
  max-token-delta:
    description: 'Maximum allowable net token increase before failing'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install tokencut
      shell: bash
      run: uv pip install --system tokencut

    - name: Run command with tokencut
      if: ${{ inputs.command != '' }}
      shell: bash
      run: tokencut run -- ${{ inputs.command }}

    - name: Analyze PR Token Impact
      if: ${{ inputs.pr-check == 'true' }}
      shell: bash
      run: |
        ARGS=""
        if [ -n "${{ inputs.max-token-delta }}" ]; then
          ARGS="--max-delta ${{ inputs.max-token-delta }}"
        fi
        tokencut pr --markdown $ARGS
