name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  python:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies & verify tests
        run: |
          uv sync --all-extras
          uv run pytest -v
          uv run ruff check .
          uv run ruff format --check .

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable app and verify signature
        run: |
          bash macos/build.sh
          codesign --verify --deep --strict macos/build/TokenCut.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('macos/build/TokenCut.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert 'TokenCutExecutable' not in info, 'Release must resolve the current user backend'
          assert (app / 'Contents/Resources/pet-3d.png').is_file()
          PY
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/TokenCut.app "dist/TokenCut-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [python, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
