<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="title">
  <title id="title">tokencut demo — measured fixture output</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .cursor { animation: blink 0.9s infinite; }
    </style>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1418"/>
      <stop offset="100%" stop-color="#050b10"/>
    </linearGradient>
  </defs>
  <rect x="16" y="12" width="848" height="396" rx="12" fill="url(#termBg)" stroke="#1e3a34" stroke-width="1.5"/>
  <rect x="16" y="12" width="848" height="36" rx="12" fill="#0d1c20"/>
  <rect x="16" y="36" width="848" height="12" fill="#0d1c20"/>
  <circle cx="40" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="80" cy="30" r="5" fill="#27c93f"/>
  <text x="440" y="34" text-anchor="middle" class="mono" font-size="12" fill="#6f9588">tokencut demo — offline, no model calls</text>

  <g class="mono" font-size="13" transform="translate(40, 78)">
    <text x="0" y="0" fill="#2ec79b">$</text>
    <text x="18" y="0" fill="#eaf7f3">tokencut demo</text>
    <rect x="148" y="-11" width="7" height="14" fill="#2ec79b" class="cursor"/>

    <text x="0" y="36" fill="#6f9588">TokenCut: verify your installation</text>
    <text x="0" y="64" fill="#9bb8ae">docker build ……………… </text>
    <text x="320" y="64" fill="#b3f5cd" font-weight="700">18,360 → 107 (99.4%)</text>
    <text x="0" y="88" fill="#9bb8ae">go test ……………………… </text>
    <text x="320" y="88" fill="#b3f5cd" font-weight="700">3,281 → 64 (98.0%)</text>
    <text x="0" y="112" fill="#9bb8ae">cargo test ………………… </text>
    <text x="320" y="112" fill="#b3f5cd" font-weight="700">3,795 → 185 (95.1%)</text>
    <text x="0" y="136" fill="#9bb8ae">pytest noisy ……………… </text>
    <text x="320" y="136" fill="#b3f5cd" font-weight="700">5,111 → 348 (93.2%)</text>
    <text x="0" y="160" fill="#9bb8ae">pytest recovery ………… </text>
    <text x="320" y="160" fill="#b3f5cd" font-weight="700">1,562 → 174 (88.9%)</text>
    <text x="0" y="184" fill="#9bb8ae">vitest / eslint / tsc …… </text>
    <text x="320" y="184" fill="#b3f5cd" font-weight="700">up to 98.8% / 79%</text>

    <rect x="0" y="210" width="800" height="44" rx="8" fill="#0d2a26" stroke="#2ec79b" stroke-width="1"/>
    <text x="16" y="237" fill="#7dffb3" font-weight="700">failure preserved · original recoverable · PASS</text>

    <text x="0" y="290" fill="#5d7a71" font-size="11">Local o200k_base estimates — not billing, quality, or subscription-limit claims.</text>
    <text x="0" y="312" fill="#5d7a71" font-size="11">Reproduce: tokencut demo --json</text>
  </g>
</svg>
