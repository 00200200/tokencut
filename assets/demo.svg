<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <defs>
    <style>
      @keyframes promptTyping {
        0%, 15% { width: 0; }
        30%, 100% { width: 380px; }
      }
      @keyframes logFade {
        0%, 30% { opacity: 0; transform: translateY(4px); }
        35%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cutNoticeFade {
        0%, 45% { opacity: 0; transform: scale(0.98); }
        50%, 100% { opacity: 1; transform: scale(1); }
      }
      @keyframes errorFade {
        0%, 55% { opacity: 0; transform: translateY(4px); }
        60%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes footerFade {
        0%, 70% { opacity: 0; transform: translateY(6px); }
        75%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .anim-log { animation: logFade 10s infinite; }
      .anim-cut { animation: cutNoticeFade 10s infinite; }
      .anim-err { animation: errorFade 10s infinite; }
      .anim-foot { animation: footerFade 10s infinite; }
      .cursor { animation: cursorBlink 0.8s infinite; }
    </style>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c101a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cutGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e2a27"/>
      <stop offset="100%" stop-color="#122538"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="840" height="460" rx="12" fill="url(#termBg)" stroke="#1e273a" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect x="20" y="20" width="840" height="38" rx="12" fill="#131928"/>
    <rect x="20" y="46" width="840" height="12" fill="#131928"/>
    <circle cx="44" cy="39" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="39" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="39" r="6" fill="#27c93f"/>
    <text x="440" y="43" text-anchor="middle" fill="#6c7c9c" font-size="12" font-weight="600" class="mono">tokencut run — pytest suite</text>
  </g>

  <!-- Prompt Command Line -->
  <g transform="translate(45, 90)">
    <text x="0" y="0" fill="#00f5a0" font-size="14" font-weight="bold" class="mono">michal@macbook</text>
    <text x="135" y="0" fill="#627293" font-size="14" class="mono">~/Projects/tokencut</text>
    <text x="315" y="0" fill="#e1e7f5" font-size="14" font-weight="bold" class="mono">$</text>
    <text x="335" y="0" fill="#ffffff" font-size="14" font-weight="600" class="mono">tokencut run pytest -v tests/</text>
  </g>

  <!-- Step 1: Initial passes -->
  <g transform="translate(45, 125)" class="anim-log">
    <text x="0" y="0" fill="#38bdf8" font-size="12" class="mono">collected 92 items</text>
    <text x="0" y="22" fill="#718096" font-size="12" class="mono">tests/test_auth.py::test_login <tspan fill="#34d399">PASSED</tspan> [  1%]</text>
    <text x="0" y="42" fill="#718096" font-size="12" class="mono">tests/test_auth.py::test_token_expiry <tspan fill="#34d399">PASSED</tspan> [  2%]</text>
    <text x="0" y="62" fill="#718096" font-size="12" class="mono">tests/test_api.py::test_get_user <tspan fill="#34d399">PASSED</tspan> [  3%]</text>
  </g>

  <!-- Step 2: tokencut smart omission box -->
  <g transform="translate(45, 205)" class="anim-cut">
    <rect width="790" height="38" rx="6" fill="url(#cutGradient)" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#00f5a0"/>
    <text x="36" y="24" fill="#6ee7b7" font-size="12.5" font-weight="bold" class="mono">[... 86 passing tests &amp; 380 routine lines omitted by tokencut (-82.5% tokens) ...]</text>
  </g>

  <!-- Step 3: Exact Failure & Traceback preserved -->
  <g transform="translate(45, 268)" class="anim-err">
    <text x="0" y="0" fill="#f87171" font-size="12" font-weight="bold" class="mono">=================================== FAILURES ===================================</text>
    <text x="0" y="20" fill="#fca5a5" font-size="12" font-weight="bold" class="mono">________________________________ test_checkout _________________________________</text>
    <text x="0" y="40" fill="#e2e8f0" font-size="12" class="mono">&gt;   assert gateway.charge(amount=100) == 'SUCCESS'</text>
    <text x="0" y="60" fill="#f87171" font-size="12" font-weight="bold" class="mono">E   AssertionError: assert 'TIMEOUT' == 'SUCCESS'</text>
    <text x="0" y="80" fill="#94a3b8" font-size="11.5" class="mono">tests/test_checkout.py:42: AssertionError</text>
    <text x="0" y="100" fill="#f87171" font-size="12" class="mono">FAILED tests/test_checkout.py::test_checkout - AssertionError</text>
  </g>

  <!-- Step 4: tokencut Telemetry Footer -->
  <g transform="translate(45, 395)" class="anim-foot">
    <rect width="790" height="50" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1"/>
    <text x="20" y="30" fill="#00f5a0" font-size="14" font-weight="bold" class="mono">tokencut</text>
    <text x="96" y="30" fill="#e2e8f0" font-size="12.5" class="mono">saved <tspan fill="#00f5a0" font-weight="bold">~14,280 tokens (-82.5%)</tspan> | Claude: <tspan fill="#38bdf8">-15,708</tspan> · GPT-4o: <tspan fill="#38bdf8">-14,280</tspan> | est. saved: <tspan fill="#facc15" font-weight="bold">$0.047</tspan></text>
  </g>
</svg>
