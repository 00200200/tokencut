<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="UsageTrim Desktop Pet Companion HUD &amp; Real-Time Rate Limit Monitor">
  <defs>
    <linearGradient id="petBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="petMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="hudGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101928" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090f1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="barCodex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="barClaude" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes floatPet {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      @keyframes hudGlow {
        0%, 100% { stroke: #00f5a0; stroke-opacity: 0.5; }
        50% { stroke: #00d9f5; stroke-opacity: 0.9; }
      }
      .floating-pet { animation: floatPet 4.5s ease-in-out infinite; }
      .beacon-ring { transform-origin: center; animation: pulseBeacon 2.5s ease-in-out infinite; }
      .hud-border { animation: hudGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1000" height="460" rx="16" fill="url(#petBg)" stroke="#172236" stroke-width="1.5"/>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.06" stroke="#00f5a0" stroke-width="1">
    <line x1="40" y1="80" x2="960" y2="80"/>
    <line x1="40" y1="160" x2="960" y2="160"/>
    <line x1="40" y1="240" x2="960" y2="240"/>
    <line x1="40" y1="320" x2="960" y2="320"/>
    <line x1="40" y1="400" x2="960" y2="400"/>
    <line x1="280" y1="40" x2="280" y2="420"/>
    <line x1="640" y1="40" x2="640" y2="420"/>
  </g>

  <!-- Header / Badge Area -->
  <g transform="translate(44, 32)">
    <rect width="320" height="28" rx="14" fill="#0c1422" stroke="#1d2d47" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#00f5a0"/>
    <circle cx="16" cy="14" r="8" fill="none" stroke="#00f5a0" stroke-width="1" class="beacon-ring"/>
    <text x="32" y="18" fill="#8ea2c6" font-size="11" font-weight="700" class="mono" letter-spacing="1.2">MACOS COMPANION · ACTIVE HUD</text>
  </g>
  <text x="380" y="52" fill="#e2e8f0" font-size="14" font-weight="600" class="sans">Real-Time Tool Output Compaction &amp; 5-Hour Quota Radar</text>

  <!-- Left Column: Animated Desktop Pet Hologram / Companion Avatar -->
  <g transform="translate(44, 86)" class="floating-pet">
    <!-- Aura Glow -->
    <ellipse cx="110" cy="160" rx="100" ry="120" fill="url(#mintGlow)"/>

    <!-- Pet Mascot Vector Illustration -->
    <!-- Base Platform Ring -->
    <ellipse cx="110" cy="275" rx="85" ry="18" fill="#0a1524" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.4"/>
    <ellipse cx="110" cy="275" rx="55" ry="10" fill="none" stroke="#00d9f5" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Robot Body Outer Shell -->
    <rect x="50" y="90" width="120" height="135" rx="36" fill="#0f192b" stroke="#00f5a0" stroke-width="2.5"/>
    
    <!-- Chest Plate -->
    <rect x="65" y="155" width="90" height="55" rx="16" fill="#08101c" stroke="#1e3250" stroke-width="1.2"/>
    <circle cx="110" cy="182" r="14" fill="#0a1828" stroke="#00d9f5" stroke-width="1.5"/>
    <polygon points="110,174 117,186 103,186" fill="#00f5a0"/>

    <!-- Antennae / Sensor Ears -->
    <path d="M 40,110 Q 25,95 28,80 Q 38,82 45,100" fill="#00d9f5" opacity="0.85"/>
    <circle cx="28" cy="80" r="5" fill="#00f5a0" filter="url(#neon)"/>
    <path d="M 180,110 Q 195,95 192,80 Q 182,82 175,100" fill="#00d9f5" opacity="0.85"/>
    <circle cx="192" cy="80" r="5" fill="#00f5a0" filter="url(#neon)"/>

    <!-- Curved Dark Face Visor Screen -->
    <rect x="62" y="105" width="96" height="42" rx="18" fill="#03070f" stroke="#00d9f5" stroke-width="1.5"/>
    <!-- Glowing Visor Eyes (Mint-Cyan Neon) -->
    <ellipse cx="88" cy="126" rx="10" ry="6" fill="#00f5a0" filter="url(#neon)"/>
    <ellipse cx="132" cy="126" rx="10" ry="6" fill="#00f5a0" filter="url(#neon)"/>
    <circle cx="86" cy="124" r="2.5" fill="#ffffff"/>
    <circle cx="130" cy="124" r="2.5" fill="#ffffff"/>

    <!-- Status Badge Under Pet -->
    <rect x="42" y="305" width="136" height="26" rx="13" fill="#0b1524" stroke="#00f5a0" stroke-width="1"/>
    <circle cx="56" cy="318" r="4" fill="#00f5a0"/>
    <text x="66" y="322" fill="#a7f3d0" font-size="11" font-weight="700" class="mono">PET: ONLINE</text>
  </g>

  <!-- Right Column: Live Glass HUD Cards -->

  <!-- Top HUD Card: 5-Hour Quota Windows -->
  <g transform="translate(290, 84)" filter="url(#hudShadow)">
    <rect width="666" height="155" rx="12" fill="url(#hudGlass)" stroke="url(#petMint)" stroke-width="1.2" class="hud-border"/>

    <!-- Window Title Bar -->
    <rect width="666" height="34" rx="12" fill="#0a1220"/>
    <rect y="22" width="666" height="12" fill="#0a1220"/>
    <circle cx="20" cy="17" r="4.5" fill="#ff5f56"/>
    <circle cx="36" cy="17" r="4.5" fill="#ffbd2e"/>
    <circle cx="52" cy="17" r="4.5" fill="#27c93f"/>
    <text x="76" y="21" fill="#8ea2c6" font-size="11.5" font-weight="700" class="mono">LIVE MODEL QUOTA SENTINEL (CLI / DESKTOP INTEGRATION)</text>
    <text x="645" y="21" text-anchor="end" fill="#00f5a0" font-size="11" font-weight="600" class="mono">SYNCED</text>

    <!-- Quota Row 1: OpenAI Codex / ChatGPT Desktop -->
    <g transform="translate(24, 46)">
      <text x="0" y="16" fill="#f1f5f9" font-size="12" font-weight="700" class="mono">OpenAI Codex (5h Window)</text>
      <text x="618" y="16" text-anchor="end" fill="#00f5a0" font-size="12" font-weight="700" class="mono">88% REMAINING</text>
      <!-- Progress Bar Background -->
      <rect x="0" y="24" width="618" height="14" rx="7" fill="#0f1a2c"/>
      <!-- Filled Progress Bar -->
      <rect x="0" y="24" width="544" height="14" rx="7" fill="url(#barCodex)"/>
      <text x="0" y="49" fill="#718096" font-size="10.5" class="mono">Reset in 3h 42m · Documented local RPC read · 0 model calls</text>
    </g>

    <!-- Quota Row 2: Claude Code CLI / Claude Desktop -->
    <g transform="translate(24, 102)">
      <text x="0" y="14" fill="#f1f5f9" font-size="12" font-weight="700" class="mono">Claude Code / Desktop (5h Window)</text>
      <text x="618" y="14" text-anchor="end" fill="#fbbf24" font-size="12" font-weight="700" class="mono">76% REMAINING</text>
      <!-- Progress Bar Background -->
      <rect x="0" y="22" width="618" height="14" rx="7" fill="#0f1a2c"/>
      <!-- Filled Progress Bar -->
      <rect x="0" y="22" width="470" height="14" rx="7" fill="url(#barClaude)"/>
      <text x="0" y="46" fill="#718096" font-size="10.5" class="mono">Reset in 1h 15m · Local CodexBar adapter · Zero cookie scraping</text>
    </g>
  </g>

  <!-- Bottom HUD Card: Token Compactor & Local Code Intelligence -->
  <g transform="translate(290, 252)" filter="url(#hudShadow)">
    <rect width="666" height="175" rx="12" fill="url(#hudGlass)" stroke="#1d2e47" stroke-width="1.2"/>

    <!-- Left Block: Real-Time Stream Compression -->
    <g transform="translate(20, 20)">
      <rect width="305" height="135" rx="8" fill="#070d17" stroke="#16253c" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#00f5a0"/>
      <text x="28" y="22" fill="#00f5a0" font-size="11" font-weight="700" class="mono">STREAM COMPRESSION (CCR)</text>
      
      <text x="14" y="48" fill="#e2e8f0" font-size="11.5" class="mono">pytest -v tests/ (120 tests)</text>
      <text x="14" y="70" fill="#f87171" font-size="11" class="mono">Raw stdout:  2,108 tokens</text>
      <text x="14" y="90" fill="#00f5a0" font-size="11.5" font-weight="bold" class="mono">UsageTrim:      458 tokens (-78.3%)</text>
      <text x="14" y="112" fill="#38bdf8" font-size="10.5" class="mono">Reversible Ref: tc_8f2a1b (cached)</text>
      <text x="14" y="128" fill="#94a3b8" font-size="9.5" class="mono">Complete failure diagnostics preserved</text>
    </g>

    <!-- Right Block: Local Code Intelligence (No-LSP) -->
    <g transform="translate(340, 20)">
      <rect width="305" height="135" rx="8" fill="#070d17" stroke="#16253c" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#00d9f5"/>
      <text x="28" y="22" fill="#00d9f5" font-size="11" font-weight="700" class="mono">LOCAL SYNTAX INTELLIGENCE</text>
      
      <text x="14" y="48" fill="#e2e8f0" font-size="11" class="mono">Zero LSP daemons · ast-grep + SQLite</text>
      <text x="14" y="70" fill="#a7f3d0" font-size="11.5" font-weight="bold" class="mono">Discovery: 1,769 vs 6,569 tok (-73%)</text>
      <text x="14" y="90" fill="#e2e8f0" font-size="11" class="mono">Modes: map · symbols · outline · search</text>
      <text x="14" y="112" fill="#fbbf24" font-size="10.5" font-weight="bold" class="mono">Guarded Symbol Edit: hash-checked</text>
      <text x="14" y="128" fill="#94a3b8" font-size="9.5" class="mono">Warm query latency: ~16ms (instant)</text>
    </g>
  </g>
</svg>
